# ===== SOLO FONDO Y CORTINAS  ·  una unica capa para portada.kra =====
COLORNAME Fondo y cortinas
NOINK

MAT BACKDROP   #182B4E #0C1527 #5E6690 GLOW
MAT CURTAIN    #9E2433 #5A1121 #C4525A FOLD 1.0 0.14
MAT TRIM       #7A1A2A #470E1C #A8404A FOLD
MAT GOLD       #C9922F #7E5A1C #EFCC72 CEL 1.0 0.22

GLOW 1240 430 900

# todo lo que no sea cortina queda como fondo, tambien por detras de las
# letras y de la cinta, para que no aparezcan huecos al pintar encima
DEF BACKDROP

# ---- cortinas ----
POLY CURTAIN 0,0 445,0 150,610 150,940 250,1010 250,1200 0,1200
POLY CURTAIN 2484,0 2040,0 2345,620 2200,900 2200,1200 2484,1200
RECT CURTAIN 430 0 2060 90
# festón del galón superior, un rojo mas oscuro
PT   TRIM 520 66
# bordado y fleco dorados del bajo de la cortina
RECT GOLD 0 760 270 1200 0 15
RECT GOLD 2215 760 2484 1200 0 15
