# ===== SOLO LOS PARCHES DE PAPEL PEGADOS SOBRE LAS LETRAS DE OSTINATO =====
COLORNAME Papel letras
NOINK
LAYERFILE layer9
INSERTBEFORE layer6

# NADA = transparente. Todo lo demas ya esta pintado debajo.
MAT NADA   #000000 #000000 #000000 NONE
# papel gris-marfil, mas frio que la crema de la cinta, para que se distingan
MAT PAPEL  #E6DFD0 #B9AC94 #FAF6EC CEL 0.9 0.10

DILATE 930 140 1550 360 2
DEF NADA

# T (primera): tira de papel del brazo derecho, con la esquina doblada
PT PAPEL 1115 423 1082 424
# I: el rombo con la punta doblada
PT PAPEL 1195 580 1195 539
# N: la hoja grande del asta izquierda y la correa de la diagonal
PT PAPEL 1335 473 1438 626
# A: la cuna del vertice
PT PAPEL 1631 542
