          <img src="/assets/medalla-7.png" alt="Medalla Psique" style="position: absolute; left: 6px; bottom: 10px; width: 56px; height: 56px; object-fit: contain; filter: grayscale(1) brightness(0.25); opacity: 0.6;">

  <!-- Logo: sobre la pantalla pequeña, 100 px a la derecha del centro; su texto ocupa la misma franja que la barra -->

  <!-- Vidas: columna derecha bajo el logo; número arriba y 25 corazones de 48 px (×4) separados 3 px; y=264..480 -->
  <div style="position: absolute; left: 1168px; top: 264px; width: 680px; height: 216px; display: flex; flex-direction: column; justify-content: space-between;">

<script>
// Overlay en directo: lee el estado del locke cada segundo desde el lanzador
const CORAZON = "<svg width=\"48\" height=\"48\" viewBox=\"0 0 12 12\" shape-rendering=\"crispEdges\" aria-hidden=\"true\" style=\"filter: drop-shadow(0 3px 0 rgba(0,0,0,0.6));\"><path d=\"M2 0h1v1h-1zM3 0h1v1h-1zM4 0h1v1h-1zM7 0h1v1h-1zM8 0h1v1h-1zM9 0h1v1h-1zM1 1h1v1h-1zM5 1h1v1h-1zM6 1h1v1h-1zM10 1h1v1h-1zM0 2h1v1h-1zM11 2h1v1h-1zM0 3h1v1h-1zM11 3h1v1h-1zM0 4h1v1h-1zM11 4h1v1h-1zM0 5h1v1h-1zM11 5h1v1h-1zM0 6h1v1h-1zM11 6h1v1h-1zM1 7h1v1h-1zM10 7h1v1h-1zM2 8h1v1h-1zM9 8h1v1h-1zM3 9h1v1h-1zM8 9h1v1h-1zM4 10h1v1h-1zM7 10h1v1h-1zM5 11h1v1h-1zM6 11h1v1h-1z\" fill=\"#000000\"></path><path d=\"M2 1h1v1h-1zM3 1h1v1h-1zM4 1h1v1h-1zM7 1h1v1h-1zM8 1h1v1h-1zM1 2h1v1h-1zM4 2h1v1h-1zM5 2h1v1h-1zM6 2h1v1h-1zM7 2h1v1h-1zM8 2h1v1h-1zM9 2h1v1h-1zM1 3h1v1h-1zM3 3h1v1h-1zM4 3h1v1h-1zM5 3h1v1h-1zM6 3h1v1h-1zM7 3h1v1h-1zM8 3h1v1h-1zM9 3h1v1h-1zM1 4h1v1h-1zM2 4h1v1h-1zM3 4h1v1h-1zM4 4h1v1h-1zM5 4h1v1h-1zM6 4h1v1h-1zM7 4h1v1h-1zM8 4h1v1h-1zM9 4h1v1h-1zM1 5h1v1h-1zM2 5h1v1h-1zM3 5h1v1h-1zM4 5h1v1h-1zM5 5h1v1h-1zM6 5h1v1h-1zM7 5h1v1h-1zM8 5h1v1h-1zM9 5h1v1h-1zM1 6h1v1h-1zM2 6h1v1h-1zM3 6h1v1h-1zM4 6h1v1h-1zM5 6h1v1h-1zM6 6h1v1h-1zM7 6h1v1h-1zM8 6h1v1h-1zM2 7h1v1h-1zM3 7h1v1h-1zM4 7h1v1h-1zM5 7h1v1h-1zM6 7h1v1h-1zM7 7h1v1h-1zM3 8h1v1h-1zM4 8h1v1h-1zM5 8h1v1h-1zM6 8h1v1h-1zM4 9h1v1h-1zM5 9h1v1h-1z\" fill=\"#e82221\"></path><path d=\"M9 1h1v1h-1zM10 2h1v1h-1zM10 3h1v1h-1zM10 4h1v1h-1zM10 5h1v1h-1zM9 6h1v1h-1zM10 6h1v1h-1zM8 7h1v1h-1zM9 7h1v1h-1zM7 8h1v1h-1zM8 8h1v1h-1zM6 9h1v1h-1zM7 9h1v1h-1zM5 10h1v1h-1zM6 10h1v1h-1z\" fill=\"#97191a\"></path><path d=\"M2 2h1v1h-1zM3 2h1v1h-1zM2 3h1v1h-1z\" fill=\"#fffefe\"></path></svg>";
const CORAZON_ROTO = "<svg width=\"48\" height=\"48\" viewBox=\"0 0 12 12\" shape-rendering=\"crispEdges\" aria-hidden=\"true\" style=\"filter: drop-shadow(0 3px 0 rgba(0,0,0,0.6));\"><path d=\"M2 0h1v1h-1zM3 0h1v1h-1zM4 0h1v1h-1zM7 0h1v1h-1zM8 0h1v1h-1zM9 0h1v1h-1zM1 1h1v1h-1zM5 1h1v1h-1zM6 1h1v1h-1zM10 1h1v1h-1zM0 2h1v1h-1zM6 2h1v1h-1zM11 2h1v1h-1zM0 3h1v1h-1zM5 3h1v1h-1zM11 3h1v1h-1zM0 4h1v1h-1zM5 4h1v1h-1zM11 4h1v1h-1zM0 5h1v1h-1zM6 5h1v1h-1zM11 5h1v1h-1zM0 6h1v1h-1zM6 6h1v1h-1zM11 6h1v1h-1zM1 7h1v1h-1zM5 7h1v1h-1zM10 7h1v1h-1zM2 8h1v1h-1zM5 8h1v1h-1zM9 8h1v1h-1zM3 9h1v1h-1zM6 9h1v1h-1zM8 9h1v1h-1zM4 10h1v1h-1zM7 10h1v1h-1zM5 11h1v1h-1zM6 11h1v1h-1z\" fill=\"#000000\"></path><path d=\"M2 1h1v1h-1zM3 1h1v1h-1zM4 1h1v1h-1zM7 1h1v1h-1zM8 1h1v1h-1zM1 2h1v1h-1zM4 2h1v1h-1zM5 2h1v1h-1zM7 2h1v1h-1zM8 2h1v1h-1zM9 2h1v1h-1zM1 3h1v1h-1zM3 3h1v1h-1zM4 3h1v1h-1zM6 3h1v1h-1zM7 3h1v1h-1zM8 3h1v1h-1zM9 3h1v1h-1zM1 4h1v1h-1zM2 4h1v1h-1zM3 4h1v1h-1zM4 4h1v1h-1zM6 4h1v1h-1zM7 4h1v1h-1zM8 4h1v1h-1zM9 4h1v1h-1zM1 5h1v1h-1zM2 5h1v1h-1zM3 5h1v1h-1zM4 5h1v1h-1zM5 5h1v1h-1zM7 5h1v1h-1zM8 5h1v1h-1zM9 5h1v1h-1zM1 6h1v1h-1zM2 6h1v1h-1zM3 6h1v1h-1zM4 6h1v1h-1zM5 6h1v1h-1zM7 6h1v1h-1zM8 6h1v1h-1zM2 7h1v1h-1zM3 7h1v1h-1zM4 7h1v1h-1zM6 7h1v1h-1zM7 7h1v1h-1zM3 8h1v1h-1zM4 8h1v1h-1zM6 8h1v1h-1zM4 9h1v1h-1zM5 9h1v1h-1z\" fill=\"#4a5070\"></path><path d=\"M9 1h1v1h-1zM10 2h1v1h-1zM10 3h1v1h-1zM10 4h1v1h-1zM10 5h1v1h-1zM9 6h1v1h-1zM10 6h1v1h-1zM8 7h1v1h-1zM9 7h1v1h-1zM7 8h1v1h-1zM8 8h1v1h-1zM7 9h1v1h-1zM5 10h1v1h-1zM6 10h1v1h-1z\" fill=\"#30344a\"></path><path d=\"M2 2h1v1h-1zM3 2h1v1h-1zM2 3h1v1h-1z\" fill=\"#7a809e\"></path></svg>";
const BRILLO = ['#3b8bff', '#3b8bff', '#3b8bff', '#ff3b55', '#ff3b55', '#ff3b55'];
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

function carta(p, i) {
  const g = BRILLO[i];
  const marco = `position: relative; border: 2px solid ${g}; border-radius: 24px 6px 24px 6px; overflow: hidden; box-shadow: 0 0 18px ${g}, inset 0 0 14px ${g};`;
  if (!p) return `<div style="${marco} background: #000000;"></div>`;
  const apagado = p.muerto ? ' filter: grayscale(1) brightness(0.5);' : '';
  const img = p.huevo ? '' : `<img src="/arte/${p.especie}" alt="" onerror="this.style.display='none'" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 20%;${apagado}">`;
  return `<div style="${marco} background: #0b1230;">${img}
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: linear-gradient(rgba(4,6,13,0), rgba(4,6,13,0.95));"></div>
    <div style="position: absolute; left: 6px; right: 6px; bottom: 10px; text-align: center; font-family: Bungee, sans-serif; font-size: 20px; line-height: 1; color: #ffffff; text-shadow: 0 0 8px ${g}, 0 2px 0 #000000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;${p.muerto ? ' text-decoration: line-through;' : ''}">${esc(p.huevo ? 'HUEVO' : p.mote)}</div></div>`;
}

// ?capa=1: la capa que va encima de Azahar; los huecos llevan el color que Windows vuelve transparente
if (new URLSearchParams(location.search).has('capa')) {
  document.querySelectorAll('.hueco').forEach((h) => { h.style.background = '#ff00ff'; });
}

function pintar(e) {
  const a = e.activo || {vidas: 25, vidas_iniciales: 25, medallas: Array(8).fill(false)};
  document.getElementById('vidas').textContent = a.vidas;
  const vial = a.vial !== false;
  document.getElementById('vial').src = vial ? '/assets/vial.png' : '/assets/vial-gastado.png';
  document.getElementById('vial').alt = vial ? 'Vial cargado' : 'Vial gastado';
  document.getElementById('vial-tecla').style.opacity = vial ? '1' : '0.4';
  // bloqueado en combate: X encima, vial apagado y la tecla en gris
  const bloqueado = !!a.vial_bloqueado;
  document.getElementById('vial-x').style.display = bloqueado ? 'block' : 'none';
  document.getElementById('vial').style.filter = (bloqueado ? 'grayscale(1) brightness(0.55) ' : '') + 'drop-shadow(0 4px 0 rgba(0,0,0,0.6))';
  Object.assign(document.getElementById('vial-tecla').style, bloqueado
    ? {background: '#8b93ad', color: '#3a4260', opacity: '1'} : {background: '#ffffff', color: '#0b1230'});
  // "texto · más texto": la segunda parte va en una línea aparte
  const aviso = document.getElementById('aviso');
  aviso.style.display = e.aviso ? 'flex' : 'none';
  document.getElementById('aviso-vial').src = vial ? '/assets/vial.png' : '/assets/vial-gastado.png';
  document.getElementById('aviso-texto').innerHTML = e.aviso ? e.aviso.split(' · ').map(esc).join('<br>') : '';
  document.getElementById('corazones').innerHTML =
    Array.from({length: a.vidas_iniciales}, (_, i) => i < a.vidas ? CORAZON : CORAZON_ROTO).join('');
  document.getElementById('equipo').innerHTML = e.equipo.map(carta).join('');
  [...document.getElementById('medallas').children].forEach((pieza, i) => {
    const [lider, medalla] = pieza.querySelectorAll('img');
    const ganada = a.medallas[i];
    // nivel tope del líder (su Pokémon más alto), abajo a la derecha en letra pixel como los corazones; apagado al ganar
    let tope = pieza.querySelector('.tope');
    if (!tope) {
      tope = document.createElement('div');
      tope.className = 'tope';
      tope.style.cssText = "position: absolute; right: 4px; bottom: 6px; z-index: 2; text-align: right; line-height: 1.15; font-family: 'Press Start 2P', monospace; color: #ffffff; text-shadow: 3px 0 #000, -3px 0 #000, 0 3px #000, 0 -3px #000, 3px 3px #000, -3px -3px #000, 3px -3px #000, -3px 3px #000, 0 6px #000;";
      pieza.appendChild(tope);
    }
    tope.innerHTML = a.topes && a.topes[i] ? `<div style="font-size: 9px;">NV</div><div style="font-size: 20px;">${a.topes[i]}</div>` : '';
    tope.style.opacity = ganada ? '0.55' : '1';
    lider.style.filter = ganada ? 'none' : 'grayscale(1) brightness(0.7)';
    lider.style.opacity = ganada ? '1' : '0.75';
    medalla.style.filter = ganada ? 'drop-shadow(0 3px 0 #000000)' : 'grayscale(1) brightness(0.25)';
    medalla.style.opacity = ganada ? '1' : '0.6';
  });
}

async function actualizar() {
  try { pintar(await (await fetch('/api/estado')).json()); } catch (err) { /* el lanzador está cerrado */ }
}
if (window.ESTADO) pintar(window.ESTADO); else actualizar();
setInterval(actualizar, 1000);
</script>
