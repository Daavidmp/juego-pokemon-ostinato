  #barra { position: absolute; left: 50%; bottom: 3.6%; width: calc(var(--u) * 30); height: calc(var(--u) * .8); margin-left: calc(var(--u) * -15); border-radius: 99px; background: rgba(255,255,255,.16); overflow: hidden; opacity: 0; transition: opacity .25s; }
  #barra i { display: block; height: 100%; width: 0; background: #FFCB05; transition: width .12s; }

  .tipos { display: flex; gap: calc(var(--u) * 1.6); }
  .tipo { padding: calc(var(--u) * .9) calc(var(--u) * 3.4); border-radius: 999px; font-family: Bungee, Nunito, sans-serif; font-size: calc(var(--u) * 5); line-height: 1.05; border: calc(var(--u) * .35) solid rgba(255,255,255,.9); box-shadow: 0 calc(var(--u) * .5) 0 rgba(0,0,0,.35), 0 0 calc(var(--u) * 4) currentColor; text-shadow: 0 3px 0 rgba(0,0,0,.28); color: #fff; }
  #total { font-family: Bungee, Nunito, sans-serif; font-size: calc(var(--u) * 13); line-height: 1; text-shadow: 0 calc(var(--u) * .5) 0 rgba(0,0,0,.4), 0 0 calc(var(--u) * 4) var(--c1); font-variant-numeric: tabular-nums; }
  .barras { display: grid; grid-template-columns: repeat(6, calc(var(--u) * 8)); gap: calc(var(--u) * .9); }
  .barra { font-weight: 900; font-size: calc(var(--u) * 1.15); display: flex; flex-direction: column; gap: calc(var(--u) * .35); }
  .barra i { display: block; height: calc(var(--u) * .7); border-radius: 9px; background: rgba(255,255,255,.2); overflow: hidden; }
  .barra b { display: block; height: 100%; width: 0; border-radius: 9px; background: #fff; box-shadow: 0 0 calc(var(--u) * .8) #fff; transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
  #icoRol { width: calc(var(--u) * 13); height: calc(var(--u) * 13); object-fit: contain; filter: drop-shadow(0 0 calc(var(--u) * 2) rgba(255,255,255,.55)); }
  #txtRol { font-family: Bungee, Nunito, sans-serif; font-size: calc(var(--u) * 5.4); line-height: 1.05; text-shadow: 0 calc(var(--u) * .35) 0 rgba(0,0,0,.4), 0 0 calc(var(--u) * 3) var(--c1); }

  /* al final: el tipo a la izquierda, los puntos y el rol a la derecha, flotando despacio */

  @keyframes flotar { from { translate: 0 calc(var(--u) * -.35); } to { translate: 0 calc(var(--u) * .35); } }
  #dTipo.lado { left: calc(var(--u) * 5); top: 48%; transform: translate(0, -50%) scale(.62); transform-origin: 0 50%; align-items: flex-start; }
  #dPuntos.lado { left: calc(100% - var(--u) * 5); top: 37%; transform: translate(-100%, -50%) scale(.58); transform-origin: 100% 50%; align-items: flex-end; animation-delay: -1.1s; }
  #dRol.lado { left: calc(100% - var(--u) * 5); top: 61%; transform: translate(-100%, -50%) scale(.6); transform-origin: 100% 50%; align-items: flex-end; text-align: right; animation-delay: -2.2s; }
  @media (prefers-reduced-motion: reduce) { .dato.lado { animation: none; } }
  .dato { transition: left .5s cubic-bezier(.3,1.2,.4,1), top .5s cubic-bezier(.3,1.2,.4,1), transform .5s cubic-bezier(.3,1.2,.4,1); }

  #carta { position: absolute; left: 50%; top: 7%; height: 74%; aspect-ratio: 1; max-width: 58%; transform: translateX(-50%); opacity: 0; box-sizing: border-box; border-radius: calc(var(--u) * 2.4); padding: calc(var(--u) * .7); background: linear-gradient(135deg, #FFF6D0, var(--c1) 45%, var(--c2) 60%, #FFF6D0); box-shadow: 0 0 calc(var(--u) * 5) var(--c1), 0 calc(var(--u) * 1) calc(var(--u) * 3) rgba(0,0,0,.6); }
  #hueco { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: calc(var(--u) * 1.8); background: radial-gradient(circle at 50% 40%, #272C3D, #0B0D14); display: flex; align-items: center; justify-content: center; }

  body.shiny #carta { background: linear-gradient(135deg, #FFF6D0, #FFC21A 40%, #FFF6D0 55%, #FFC21A); box-shadow: 0 0 calc(var(--u) * 6) #FFD54A; }

  #haz { position: absolute; left: 50%; top: -4%; width: calc(var(--u) * 40); height: 92%; margin-left: calc(var(--u) * -20); opacity: 0; background: linear-gradient(to bottom, rgba(255,255,255,.55), rgba(255,255,255,.1)); clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%); filter: blur(calc(var(--u) * 1.4)); }

<body>
<div id="escena">
  <img id="fondo" src="/assets/huevo-fondo.jpg" alt="">
  <div id="rayos"></div>
  <div id="haz"></div>
  <div id="tinte"></div>
  <div id="oscuro"></div>
  <div id="halo"></div>
  <div id="carta"><div id="hueco"><span id="incognita">?</span><img id="arte" alt=""><i id="luz"></i></div></div>
  <div id="onda"></div>
  <div id="sombra"></div>
  <div id="poke"><img id="pokeColor" alt=""><img id="pokeLuz" alt=""></div>
  <img class="pieza" id="huevo" alt="">
  <img class="pieza cascara" id="abajo" src="/assets/huevo-abajo.png" alt="">
  <img class="pieza cascara" id="arriba" src="/assets/huevo-arriba.png" alt="">
  <div class="dato" id="dTipo"><span class="tit">TIPO</span><div class="tipos" id="tipos"></div></div>
  <div class="dato" id="dPuntos"><span class="tit">PUNTOS BASE</span><div id="total">0</div><div class="barras" id="barras"></div></div>

  <div id="brillo">★ SHINY</div>
  <div id="dialogo"></div>
  <div id="pista"><div id="aviso"><span>Pulsa</span><span id="tecla">ENTER</span><span>para romperlo</span></div></div>
  <div id="barra"><i id="carga"></i></div>
  <canvas id="chispas"></canvas>
  <div id="destello"></div>
  <div id="fundido"></div>
</div>
<script>
const $ = (i) => document.getElementById(i);
const espera = (ms) => new Promise((r) => setTimeout(r, ms));
const q = new URLSearchParams(location.search);
const TIPOS = {NORMAL: ['Normal', '#9FA19F'], FIRE: ['Fuego', '#E62829'], WATER: ['Agua', '#2980EF'], ELECTRIC: ['Eléctrico', '#E8B400'], GRASS: ['Planta', '#3FA129'],
  ICE: ['Hielo', '#3DCEF3'], FIGHTING: ['Lucha', '#FF8000'], POISON: ['Veneno', '#9141CB'], GROUND: ['Tierra', '#915121'], FLYING: ['Volador', '#81B9EF'], PSYCHIC: ['Psíquico', '#EF4179'],
  BUG: ['Bicho', '#91A119'], ROCK: ['Roca', '#AFA981'], GHOST: ['Fantasma', '#704170'], DRAGON: ['Dragón', '#5060E1'], DARK: ['Siniestro', '#624D4E'], STEEL: ['Acero', '#60A1B8'], FAIRY: ['Hada', '#EF70EF']};
const AVISO_HUEVO = '¿Eh...? ¡El huevo está haciendo un ruido extraño!';
const GRIETAS = 9, GOLPES = 20;      // cada Enter es un golpe; cada dos, una grieta más
const AVISO = 2500, SOLO = 60000;    // sin pulsar: a los 2,5 s lo pide otra vez, y al minuto se rompe solo para no dejar el juego parado

// ---------- sonidos hechos con código ----------
let ctx = null;
try { ctx = new AudioContext(); } catch { /* sin audio */ }
// el volumen del emulador (0-1), para que no suene más fuerte que el juego
const VOL = Math.min(1, Math.max(0, parseFloat(q.get('vol') ?? '1') || 0));
const SALIDA = ctx && ctx.createGain();
if (SALIDA) { SALIDA.gain.value = VOL; SALIDA.connect(ctx.destination); }
function nota(f, dur, vol = .15, onda = 'sine', hasta = f) {
  if (!ctx) return;
  const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
  o.type = onda; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, hasta), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(SALIDA); o.start(); o.stop(t + dur);
}
function ruido(dur, vol = .2, corte = 1800, sube = false) {
  if (!ctx) return;
  const n = Math.floor(ctx.sampleRate * dur), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(), t = ctx.currentTime;
  s.buffer = b; f.type = 'lowpass'; f.frequency.setValueAtTime(sube ? 200 : corte, t);
  if (sube) f.frequency.exponentialRampToValueAtTime(corte, t + dur);
  g.gain.setValueAtTime(sube ? .001 : vol, t); g.gain.exponentialRampToValueAtTime(sube ? vol : .0001, t + dur);
  s.connect(f).connect(g).connect(SALIDA); s.start();
}
// los efectos grabados; si alguno no carga, suena el hecho con código
const SONIDOS = {};
async function cargarSonidos() {
  if (!ctx) return;
  await Promise.all(['grieta', 'estallido', 'golpe'].map(async (n) => {
    try { SONIDOS[n] = await ctx.decodeAudioData(await (await fetch(`/assets/sfx-${n}.mp3`)).arrayBuffer()); } catch { /* sin él */ }
  }));
}
function sonar(n, vol = 1, tono = 1) {
  if (!SONIDOS[n]) return false;
  const s = ctx.createBufferSource(), g = ctx.createGain();
  s.buffer = SONIDOS[n]; s.playbackRate.value = tono; g.gain.value = vol;
  s.connect(g).connect(SALIDA); s.start();
  return true;
}
const golpe = () => { if (!sonar('golpe', .9)) { nota(120, .5, .5, 'sine', 32); ruido(.35, .3, 900); } };
const crac = (i) => { if (!sonar('grieta', .85, 1 + i * .025)) { ruido(.09, .28, 3800); nota(900 + i * 90, .06, .06, 'square', 300); } };
const estallido = () => { if (!sonar('estallido')) { golpe(); nota(70, 1.2, .5, 'sawtooth', 30); } };
const tic = (f) => nota(f, .05, .05, 'triangle');
const fanfarria = () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => { nota(f, .7, .14, 'sawtooth'); nota(f / 2, .7, .1, 'triangle'); }, i * 110));

// la música: la tensión en bucle hasta que estalla, y luego la revelación (si no está el archivo, se sigue sin ella)
const musica = new Audio('/assets/huevo-tension.mp3'), revelacion = new Audio('/assets/huevo-revelacion.mp3');
musica.loop = true;
musica.volume = .8 * VOL;
revelacion.loop = true;
revelacion.volume = .9 * VOL;
const salePokemon = () => {
  musica.pause(); revelacion.play().catch(() => {});
  ['dTipo', 'dPuntos', 'dRol'].forEach((id, i) => $(id).animate([{scale: 1}, {scale: 1.16}, {scale: 1}], {duration: 460, delay: 120 + i * 110, easing: 'cubic-bezier(.2,.9,.3,1)'}));
};

// ---------- chispas ----------
const lienzo = $('chispas'), c2d = lienzo.getContext('2d');
let chispas = [];
function medir() { lienzo.width = innerWidth; lienzo.height = innerHeight; }
addEventListener('resize', medir); medir();
function soltar(n, fuerza = 8, color = '255,214,110', cx = .5, cy = .5) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (.3 + Math.random()) * fuerza;
    chispas.push({x: innerWidth * cx, y: innerHeight * cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.5, vida: 1, r: 1 + Math.random() * 3.4, color});
  }
}
(function pinta() {
  c2d.clearRect(0, 0, lienzo.width, lienzo.height);
  c2d.globalCompositeOperation = 'lighter';
  chispas = chispas.filter((p) => p.vida > 0);
  for (const p of chispas) {
    p.x += p.vx; p.y += p.vy; p.vy += .1; p.vx *= .985; p.vida -= .012;
    c2d.fillStyle = `rgba(${p.color},${p.vida})`;
    c2d.beginPath(); c2d.arc(p.x, p.y, p.r, 0, 7); c2d.fill();
  }
  requestAnimationFrame(pinta);
})();

// ---------- ayudas ----------
const anima = (el, k, o) => el.animate(k, {fill: 'forwards', easing: 'ease-out', ...o}).finished;
const ver = (el, o, ms = 300) => anima(el, [{opacity: getComputedStyle(el).opacity}, {opacity: o}], {duration: ms});
function temblor(el, amp, ms) {
  const k = Array.from({length: 9}, (_, i) => ({transform: `translate(${(i % 2 ? 1 : -1) * amp}px, ${(i % 3 - 1) * amp * .4}px) rotate(${(i % 2 ? 1 : -1) * amp * .5}deg)`}));
  k.push({transform: 'none'});
  return el.animate(k, {duration: ms}).finished;
}
const sacude = (amp = 16, ms = 380) => $('escena').animate(Array.from({length: 10}, (_, i) => ({transform: i === 9 ? 'none' : `translate(${(i % 2 ? 1 : -1) * amp * (1 - i / 9)}px, ${(i % 3 - 1) * amp * (1 - i / 9)}px)`})), {duration: ms}).finished;
async function fogonazo(arriba = 90, abajo = 650) {
  await ver($('destello'), 1, arriba);
  await ver($('destello'), 0, abajo);
}
async function golpeDato(el) {
  el.style.opacity = 1;
  const k = el.querySelectorAll(':scope > *');
  el.animate([{opacity: 0, scale: 2.6, filter: 'blur(14px)'}, {opacity: 1, scale: 1, filter: 'blur(0)'}], {duration: 300, easing: 'cubic-bezier(.2,.9,.3,1)'});
  await espera(230);
  golpe(); sacude(14, 320); soltar(70, 9, '255,255,255');
  return k;
}
function cargar(src) {
  return new Promise((r) => { const i = new Image(); i.onload = i.onerror = () => r(i); i.src = src; });
}

// dónde está el suelo de la plataforma: es parte de la imagen de fondo (1376x768, a 106 % y recortada)
function plataforma() {
  const s = Math.max(innerWidth * 1.06 / 1376, innerHeight * 1.06 / 768);
  return {x: innerWidth / 2, y: innerHeight / 2 + (622 - 384) * s, rx: 272 * s, ry: 34 * s};
}
// el recuadro que de verdad ocupa el Pokémon sumando todos los fotogramas: cada animación deja un margen distinto,
// y la parte de abajo son sus pies en el punto más bajo
async function medirGif(url) {
  const r = await fetch(url);
  if (!r.ok) return null;
  const blob = await r.blob(), gif = {url: URL.createObjectURL(blob)};
  let lienzoG, g2;
  const mirar = (imagen, w, h) => {
    lienzoG = lienzoG || new OffscreenCanvas(w, h);
    g2 = g2 || lienzoG.getContext('2d', {willReadFrequently: true});
    g2.clearRect(0, 0, w, h);
    g2.drawImage(imagen, 0, 0);
    const d = g2.getImageData(0, 0, w, h).data;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (d[(y * w + x) * 4 + 3] < 60) continue;
      gif.izq = Math.min(gif.izq ?? x, x); gif.der = Math.max(gif.der ?? x, x);
      gif.arr = Math.min(gif.arr ?? y, y); gif.aba = Math.max(gif.aba ?? y, y);
    }
    gif.w = w; gif.h = h;
  };
  try {
    const dec = new ImageDecoder({data: await blob.arrayBuffer(), type: 'image/gif'});
    await dec.tracks.ready;
    const n = dec.tracks.selectedTrack.frameCount;
    for (let i = 0; i < n; i += Math.max(1, Math.floor(n / 24))) {
      const {image} = await dec.decode({frameIndex: i});
      mirar(image, image.displayWidth, image.displayHeight);
      image.close();
    }
  } catch {
    const i = await cargar(gif.url);
    if (!i.naturalWidth) return null;
    mirar(i, i.naturalWidth, i.naturalHeight);
  }
  return gif.aba === undefined ? null : gif;
}
function colocarPokemon(g) {
  const P = plataforma(), caja = g.der - g.izq + 1, alto = g.aba - g.arr + 1, poke = $('poke');
  const k = Math.min(innerWidth * .36 / caja, innerHeight * .54 / alto, innerHeight / 240);
  const pieX = (g.izq + caja / 2) * k, pieY = (g.aba + 1) * k;
  Object.assign(poke.style, {width: `${g.w * k}px`, height: `${g.h * k}px`, left: `${P.x - pieX}px`, top: `${P.y - pieY + 2}px`, transformOrigin: `${pieX}px ${pieY}px`});
  $('pokeColor').src = $('pokeLuz').src = g.url;
  const anchoS = Math.min(caja * k * .95, P.rx * 1.7);
  Object.assign($('sombra').style, {width: `${anchoS}px`, height: `${Math.max(P.ry * .7, anchoS * .13)}px`, left: `${P.x - anchoS / 2}px`, top: `${P.y - Math.max(P.ry * .7, anchoS * .13) / 2}px`});
  return P;
}
function onda() {
  const P = plataforma(), o = $('onda');
  Object.assign(o.style, {left: `${P.x - P.rx}px`, top: `${P.y - P.ry}px`, width: `${P.rx * 2}px`, height: `${P.ry * 2}px`});
  o.animate([{opacity: .95, transform: 'scale(.35)'}, {opacity: 0, transform: 'scale(1.9)'}], {duration: 750, easing: 'cubic-bezier(.2,.7,.3,1)'});
}
async function salidaCarta(f) {
  // 7. la carta sale tapada y se descubre por tramos, de abajo arriba, con la línea de luz
  const arte = $('arte'), carta = $('carta'), luz = $('luz');
  arte.src = `/arte/${f.especie}`;
  ver($('rayos'), .75, 900);
  carta.style.opacity = 1;
  carta.animate([{opacity: 0, translate: '0 8vh', scale: .8}, {opacity: 1, translate: '0 0', scale: 1}], {duration: 900, easing: 'cubic-bezier(.2,.9,.3,1.2)'});
  await espera(700);
  golpe(); soltar(50, 7, '255,255,255');
  ruido(4.6, .24, 5200, true);
  await espera(800);
  luz.style.opacity = 1;
  for (const p of [14, 34, 58, 84]) {
    arte.style.clipPath = `inset(${100 - p}% 0 0 0)`;
    luz.style.bottom = `${p}%`;
    tic(260 + p * 6);
    soltar(34, 6, '255,255,255', .5, .78 - p * .0066);
    await espera(820);
  }
  arte.style.transition = luz.style.transition = 'all .22s';
  arte.style.clipPath = 'inset(0 0 0 0)';
  luz.style.bottom = '100%';
  await espera(200);
  luz.style.opacity = 0;
  salePokemon();
  fogonazo(70, 800);
  golpe(); fanfarria(); sacude(18, 460); soltar(320, 16, f.shiny ? '255,226,120' : '255,255,255', .5, .45);
  carta.animate([{scale: 1.1}, {scale: 1}], {duration: 700, easing: 'cubic-bezier(.2,.9,.3,1)'});
}
async function salidaAnimada(f) {
  const P = colocarPokemon(f.gif), poke = $('poke'), cy = P.y / innerHeight, cx = .5;
  ver($('rayos'), .6, 900);
  ver($('haz'), 1, 900);
  ruido(2.9, .26, 5200, true);
  await espera(700);
  // baja despacio por el haz, en blanco, y al final cae
  poke.style.opacity = 1;
  await poke.animate([{transform: 'translateY(-82vh)', opacity: 0, easing: 'ease-out'}, {transform: 'translateY(-60vh)', opacity: 1, offset: .25, easing: 'linear'}, {transform: 'translateY(-26vh)', offset: .78, easing: 'cubic-bezier(.6,0,1,.6)'}, {transform: 'none'}], {duration: 2300}).finished;
  // aterriza: pisa la plataforma
  golpe(); sacude(22, 460); onda();
  soltar(80, 8, '225,228,240', cx, cy);
  ver($('sombra'), 1, 120);
  poke.animate([{transform: 'scale(1.16, .78)'}, {transform: 'scale(.94, 1.07)', offset: .45}, {transform: 'none'}], {duration: 420, easing: 'ease-out'});
  await espera(900);
  // el color le va llegando
  $('pokeColor').style.opacity = 1;
  ruido(1.5, .2, 6000, true);
  for (let i = 0; i < 5; i++) { soltar(20, 6, '255,255,255', cx, cy - .22); await espera(240); }
  anima($('pokeLuz'), [{opacity: 1}, {opacity: 0}], {duration: 500});
  salePokemon();
  fogonazo(70, 800);
  golpe(); fanfarria(); sacude(14, 420); onda(); soltar(320, 16, f.shiny ? '255,226,120' : '255,255,255', cx, cy - .2);
  ver($('haz'), .5, 900);
  poke.animate([{transform: 'scale(1.08)'}, {transform: 'none'}], {duration: 600, easing: 'cubic-bezier(.2,.9,.3,1)'});
}

// ---------- la secuencia ----------
async function secuencia(f) {
  const tipos = f.tipos.filter((t) => TIPOS[t]);
  const cols = tipos.length ? tipos.map((t) => TIPOS[t][1]) : ['#8E99B0'];
  document.documentElement.style.setProperty('--c1', cols[0]);
  document.documentElement.style.setProperty('--c2', cols[cols.length - 1]);
  document.body.classList.toggle('shiny', !!f.shiny);
  $('tipos').innerHTML = tipos.map((t) => `<span class="tipo" style="background:${TIPOS[t][1]};color:${TIPOS[t][1]}"><span style="color:#fff">${TIPOS[t][0]}</span></span>`).join('');
  const B = f.base;
  const fil = [['PS', B.ps], ['Ataque', B.ataque], ['Defensa', B.defensa], ['At. esp.', B.ataque_esp], ['Def. esp.', B.defensa_esp], ['Velocidad', B.velocidad]];
  $('barras').innerHTML = fil.map(([n, v]) => `<div class="barra"><span>${n} ${v}</span><i><b data-v="${Math.min(100, v / 1.8)}"></b></i></div>`).join('');
  $('txtRol').textContent = f.rol;
  $('nombre').textContent = f.nombre;

  // 1. el huevo cae a la plataforma
  musica.play().catch(() => {});
  await ver($('fundido'), 0, 700);
  const hv = $('huevo');
  hv.style.opacity = 1;
  hv.src = '/assets/huevo-entero.png';
  await anima(hv, [{transform: 'translateY(-130vh) rotate(-14deg)', easing: 'cubic-bezier(.5,0,.9,.6)'}, {transform: 'translateY(0) scale(1.08,.9)', offset: .78}, {transform: 'translateY(-4vh) scale(.97,1.03)', offset: .9}, {transform: 'none'}], {duration: 900, fill: 'none'});
  golpe(); sacude(10, 260); soltar(26, 5, '220,220,230', .5, .68);
  await espera(800);

  // el aviso de siempre, letra a letra, con el huevo moviéndose un poco
  const dialogo = $('dialogo');
  dialogo.classList.add('ver');
  temblor(hv, 3, 420);
  for (const [i, letra] of [...AVISO_HUEVO].entries()) {
    dialogo.textContent += letra;
    if (i % 2 === 0 && letra !== ' ') tic(520);
    await espera(38);
  }
  temblor(hv, 4, 420);
  await espera(1500);
  dialogo.classList.remove('ver');
  await espera(220);

  // 2. cada Enter es un golpe; si no pulsas, te lo pide
  const halo = $('halo'), pista = $('pista');
  $('barra').style.opacity = 1;
  await new Promise((fin) => {
    let n = 0, pedir, rendirse;
    const esperar = () => {
      clearTimeout(pedir); clearTimeout(rendirse);
      pedir = setTimeout(() => pista.classList.add('ver'), n ? AVISO : 900);
      rendirse = setTimeout(acabar, SOLO);
    };
    const acabar = () => { clearTimeout(pedir); clearTimeout(rendirse); removeEventListener('keydown', tecla); pista.classList.remove('ver'); fin(); };
    const tecla = (ev) => {
      if (ev.key !== 'Enter') return;
      ev.preventDefault();
      if (ev.repeat) return;                         // dejarlo pulsado no vale
      n++;
      pista.classList.remove('ver');
      const g = Math.ceil(n / GOLPES * GRIETAS);
      hv.src = `/assets/huevo-g${g}.png`;
      crac(g);
      soltar(8 + g * 4, 3 + g * .7);
      halo.getAnimations().forEach((x) => x.cancel());
      ver(halo, g / GRIETAS * .75, 120);
      hv.getAnimations().forEach((x) => x.cancel());
      temblor(hv, 4 + g * 1.6, 170);
      $('carga').style.width = `${n / GOLPES * 100}%`;
      if (n >= GOLPES) return acabar();
      esperar();
    };
    addEventListener('keydown', tecla);
    esperar();
  });
  $('barra').style.opacity = 0;

  // 3. último temblor, y estalla
  ver($('rayos'), .9, 900);
  ruido(1.2, .34, 6500, true);
  anima(hv, [{scale: 1}, {scale: 1.18}], {duration: 1100, easing: 'ease-in'});
  await Promise.all([temblor(hv, 13, 1100), ver(halo, 1, 1100)]);
  ver($('destello'), 1, 90);
  await espera(95);
  estallido();
  hv.style.display = 'none';
  $('abajo').style.opacity = $('arriba').style.opacity = 1;
  soltar(280, 17);
  anima($('arriba'), [{transform: 'none'}, {transform: 'translate(52vw, -70vh) rotate(150deg) scale(1.3)', opacity: 0}], {duration: 1200, easing: 'cubic-bezier(.2,.7,.5,1)'});
  anima($('abajo'), [{transform: 'none'}, {transform: 'translate(-52vw, 64vh) rotate(-130deg) scale(1.3)', opacity: 0}], {duration: 1200, easing: 'cubic-bezier(.2,.7,.5,1)'});
  ver(halo, 0, 500);
  await ver($('destello'), 0, 900);
  await espera(600);

  // 4. tipo: la pantalla coge su color
  await ver($('rayos'), .35, 300);
  ver($('tinte'), .85, 900);
  await espera(300);
  await golpeDato($('dTipo'));
  await espera(1700);
  $('dTipo').classList.add('lado');
  await espera(550);

  // 5. puntos base: el contador sube
  $('dPuntos').style.opacity = 1;
  $('dPuntos').animate([{opacity: 0, scale: .8}, {opacity: 1, scale: 1}], {duration: 240});
  document.querySelectorAll('.barra b').forEach((b) => { b.style.width = b.dataset.v + '%'; });
  const inicio = performance.now(), dura = 1600;
  let ultimo = 0;
  await new Promise((fin) => {
    (function sube(t) {
      const x = Math.min(1, (t - inicio) / dura), n = Math.round(f.total * (1 - (1 - x) ** 3));
      $('total').textContent = n;
      if (n - ultimo >= 12) { tic(300 + n * 1.4); ultimo = n; }
      x < 1 ? requestAnimationFrame(sube) : fin();
    })(inicio);
  });
  golpe(); sacude(12, 300); soltar(90, 9, '255,255,255');
  $('total').animate([{scale: 1.28}, {scale: 1}], {duration: 320, easing: 'ease-out'});
  await espera(1500);
  $('dPuntos').classList.add('lado');
  await espera(550);

  // 6. rol
  await golpeDato($('dRol'));
  await espera(1800);
  $('dRol').classList.add('lado');
  await espera(700);

  // 7. el Pokémon; sin animación (sin internet, por ejemplo), la carta con el fan art
  await (f.gif ? salidaAnimada(f) : salidaCarta(f));
  await espera(350);
  $('nombre').style.opacity = 1;
  $('nombre').animate([{opacity: 0, scale: 2}, {opacity: 1, scale: 1}], {duration: 320, easing: 'cubic-bezier(.2,.9,.3,1)'});
  if (f.shiny) {
    $('brillo').style.opacity = 1;
    $('brillo').animate([{scale: 2.4, opacity: 0}, {scale: 1, opacity: 1}], {duration: 300});
    fanfarria();
    for (let i = 0; i < 12; i++) setTimeout(() => soltar(30, 6, '255,226,120', .3 + Math.random() * .4, .2 + Math.random() * .5), i * 320);
  }
  await espera(6000);
  await ver($('fundido'), 1, 900);
  revelacion.pause();
}

(async () => {
  const f = await (await fetch(`/api/apertura?especie=${encodeURIComponent(q.get('especie') || '')}&shiny=${q.get('shiny') === '1' ? 1 : 0}`)).json();
  if (f.error) { document.title = 'Pokelocke fin'; return; }
  // todo cargado antes de empezar, para que no salte nada a medias
  await Promise.all([...Array.from({length: GRIETAS + 1}, (_, i) => cargar(`/assets/huevo-g${i}.png`)), cargar('/assets/huevo-entero.png'), cargar(`/arte/${f.especie}`), document.fonts.ready]);
  await cargarSonidos();
  f.gif = await medirGif(`/ani/${f.especie}?shiny=${f.shiny ? 1 : 0}`).catch(() => null);
  const ico = await cargar(`/assets/${f.icono}.png`);
  if (ico.naturalWidth) $('icoRol').src = ico.src; else $('icoRol').remove();
  document.title = 'Pokelocke apertura';
  while (screenX < -1000) await espera(40);          // Pokelocke la saca de fuera de la pantalla cuando ya la ha colocado
  focus();
  ctx?.resume().catch(() => {});                     // sin esperarlo: si el navegador no deja sonar, se ve igual
  try { await secuencia(f); } finally { document.title = 'Pokelocke fin'; }
})();
</script>
